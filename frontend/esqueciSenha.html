<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Recuperar Palavra-passe</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Design System Global -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="auth-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: var(--brand-primary-light); color: var(--brand-primary);">
                            <i class="bi bi-key-fill fs-3"></i>
                        </div>
                        <h2 class="h4 fw-bold mb-1" style="color: var(--brand-primary);">Esqueceu a senha?</h2>
                        <p class="text-muted small">Sem problemas! Insira o seu e-mail cadastrado e enviaremos o link seguro para redefinição.</p>
                    </div>

                    <form id="formEsqueci" novalidate>
                        
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="emailRecuperacao" placeholder="nome@exemplo.com" required autocomplete="email">
                            <label for="emailRecuperacao">
                                <i class="bi bi-envelope me-1 text-muted"></i> O seu E-mail
                            </label>
                        </div>

                        <div id="msgRecuperacao" class="mb-3 text-center small fw-bold" aria-live="polite"></div>

                        <button type="submit" class="btn btn-senac-primary w-100 py-3 mb-3 shadow-sm" id="btnEnviarLink">
                            <span>Enviar Link de Recuperação</span>
                            <i class="bi bi-send-fill"></i>
                        </button>

                        <a href="index.html" class="btn btn-senac-outline w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-arrow-left"></i>
                            <span>Voltar ao Login</span>
                        </a>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
