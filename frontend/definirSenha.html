<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Nova Palavra-passe</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Design System Global -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="auth-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: var(--brand-accent-light); color: var(--brand-accent);">
                            <i class="bi bi-shield-lock-fill fs-3"></i>
                        </div>
                        <h2 class="h4 fw-bold mb-1" style="color: var(--brand-primary);">Criar Nova Senha</h2>
                        <p class="text-muted small">Defina uma palavra-passe forte e segura para a sua conta.</p>
                    </div>

                    <form id="formRedefinir" novalidate>
                        
                        <div class="form-floating mb-3 password-toggle-wrapper">
                            <input type="password" class="form-control" id="novaSenha" placeholder="Nova Senha" required autocomplete="new-password">
                            <label for="novaSenha">
                                <i class="bi bi-lock me-1 text-muted"></i> Nova Palavra-passe
                            </label>
                            <button type="button" class="password-toggle-btn" onclick="toggleVisibilidade('novaSenha', this)" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div class="form-floating mb-3 password-toggle-wrapper">
                            <input type="password" class="form-control" id="confirmarNovaSenha" placeholder="Confirmar Senha" required autocomplete="new-password">
                            <label for="confirmarNovaSenha">
                                <i class="bi bi-lock-fill me-1 text-muted"></i> Confirmar Palavra-passe
                            </label>
                            <button type="button" class="password-toggle-btn" onclick="toggleVisibilidade('confirmarNovaSenha', this)" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div id="msgRedefinir" class="mb-3 text-center small fw-bold" aria-live="polite"></div>

                        <button type="submit" class="btn btn-senac-primary w-100 py-3 mb-3 shadow-sm" id="btnSalvarNovaSenha">
                            <span>Atualizar Palavra-passe</span>
                            <i class="bi bi-check-circle-fill"></i>
                        </button>

                        <div class="text-center">
                            <a href="index.html" class="link-senac small">Voltar à tela de login</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleVisibilidade(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input && icon) {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            }
        }
    </script>
</body>
</html>
