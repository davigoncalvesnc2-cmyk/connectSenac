<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Conta de Modelo</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Design System Global -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper py-4 py-md-5">

    <div class="container d-flex justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            <div class="auth-card p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <span class="badge-senac-accent mb-2">
                        <i class="bi bi-mortarboard-fill"></i> Atendimentos & Práticas
                    </span>
                    <h2 class="h3 fw-bold mb-1" style="color: var(--brand-primary);">Criar Nova Conta</h2>
                    <p class="text-muted small">Participe como modelo nos atendimentos práticos dos cursos do Senac.</p>
                </div>

                <form id="formCadastro" novalidate>
                    
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nome" placeholder="Nome Completo" required autocomplete="name">
                        <label for="nome">
                            <i class="bi bi-person me-1 text-muted"></i> Nome Completo
                        </label>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="email" placeholder="E-mail" required autocomplete="email">
                                <label for="email">
                                    <i class="bi bi-envelope me-1 text-muted"></i> E-mail
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="tel" class="form-control" id="telefone" placeholder="Telefone" required autocomplete="tel">
                                <label for="telefone">
                                    <i class="bi bi-whatsapp me-1 text-muted"></i> WhatsApp / Telefone
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="form-floating password-toggle-wrapper">
                                <input type="password" class="form-control" id="senha" placeholder="Palavra-passe" required autocomplete="new-password">
                                <label for="senha">
                                    <i class="bi bi-lock me-1 text-muted"></i> Palavra-passe
                                </label>
                                <button type="button" class="password-toggle-btn" onclick="toggleVisibilidade('senha', this)" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating password-toggle-wrapper">
                                <input type="password" class="form-control" id="confirmar_senha" placeholder="Confirmar Palavra-passe" required autocomplete="new-password">
                                <label for="confirmar_senha">
                                    <i class="bi bi-lock-fill me-1 text-muted"></i> Confirmar Senha
                                </label>
                                <button type="button" class="password-toggle-btn" onclick="toggleVisibilidade('confirmar_senha', this)" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-light rounded-4 mb-4 border" style="border-color: var(--surface-border) !important;">
                        <h6 class="fw-bold mb-3 d-flex align-items-center gap-2" style="color: var(--brand-primary);">
                            <i class="bi bi-shield-check text-success"></i> Privacidade e Termos (LGPD)
                        </h6>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="termoUso" required>
                            <label class="form-check-label small text-secondary" for="termoUso">
                                Li e aceito os <a href="#" class="link-senac">Termos de Uso</a> e a <a href="#" class="link-senac">Política de Privacidade</a>.*
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termoImagem">
                            <label class="form-check-label small text-muted" for="termoImagem">
                                Autorizo o uso de imagens dos procedimentos realizados para o portfólio acadêmico da turma (Opcional).
                            </label>
                        </div>
                    </div>

                    <div id="mensagemCadastro" class="mb-3 text-center small fw-bold" aria-live="polite"></div>

                    <button type="submit" class="btn btn-senac-primary w-100 py-3 mb-3 shadow-sm" id="btnFinalizarCadastro">
                        <span>Finalizar Registo</span>
                        <i class="bi bi-arrow-right-circle"></i>
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Já possui uma conta ativa? 
                        <a href="index.html" class="link-senac fw-bold ms-1">Faça Login</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleVisibilidade(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input && icon) {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            }
        }
    </script>
</body>
</html>
